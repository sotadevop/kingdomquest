# More memory for Gradle; the Minecraft jar is large.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric versions. Check https://fabricmc.net/develop when updating Minecraft.
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
fabric_api_version=0.163.0+26.3

# Mod properties
mod_version=0.1.0-dev
maven_group=io.github.sotadevop
archives_base_name=kingdomquest

# Optional integration. Check https://modrinth.com/mod/modmenu/versions when updating Minecraft.
modmenu_version=21.0.0
