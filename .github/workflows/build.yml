# Builds the mod on every push, checks the jar, starts a dedicated server with it and
# publishes the jar to the ci-jar branch (main only). Publishes nothing else, uses no secrets.
name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # only for the ci-jar branch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # to see which files a branch changed against main
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Report build errors (1)
        if: failure()
        run: |
          python3 .github/scripts/condense-errors.py build.log > report.txt
          .github/scripts/annotate.sh report.txt 0 "Build log"
      - name: Report build errors (2)
        if: failure()
        run: .github/scripts/annotate.sh report.txt 10 "Build log"

      - name: Check the jar contents
        run: |
          jar=$(ls build/libs/kingdomquest-*.jar | grep -v sources)
          unzip -Z1 "$jar" > contents.txt
          for f in fabric.mod.json \
                   io/github/sotadevop/kingdomquest/KingdomQuest.class \
                   io/github/sotadevop/kingdomquest/KingdomQuestClient.class \
                   assets/kingdomquest/lang/en_us.json \
                   io/github/sotadevop/kingdomquest/charter/RoyalCharter.class \
                   io/github/sotadevop/kingdomquest/client/FoundingScreen.class \
                   io/github/sotadevop/kingdomquest/client/KingdomScreen.class \
                   kingdomquest/buildings/temperate/tent_1.json \
                   kingdomquest/buildings/frozen/tent_3.json \
                   kingdomquest/buildings/temperate/hamlet_1.json \
                   kingdomquest/buildings/frozen/farm_1.json \
                   assets/kingdomquest/textures/item/royal_charter.png \
                   data/kingdomquest/recipe/royal_charter.json \
                   data/kingdomquest/advancement/recipes/misc/royal_charter.json; do
            grep -qx "$f" contents.txt || { echo "::error title=Jar check::missing $f"; exit 1; }
          done

      # The building templates are generated: they must be up to date, and the settlement they make must hold
      # together (roads reach every door, nothing is sealed off, floats or overlaps). See tools/check.py.
      # It takes about 25 minutes, so it runs after the compile (a typo fails in minutes, not half an hour) and on
      # branches only when the buildings' sources changed. On main it always runs before the jar is published.
      - name: Do the buildings need checking?
        id: buildings
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only origin/main...HEAD | grep -qE '^(tools/|src/main/resources/kingdomquest/|src/main/java/io/github/sotadevop/kingdomquest/building/)'; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          else
            echo "check=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Buildings::not checked: no building sources changed on this branch (always checked on main)"
          fi
      - name: Check the buildings
        if: steps.buildings.outputs.check == 'true'
        run: |
          python3 tools/buildings.py
          git diff --quiet -- src/main/resources/kingdomquest || { echo "::error title=Buildings::templates are stale: run python3 tools/buildings.py and commit"; exit 1; }
          python3 tools/check.py > check.txt || { head -40 check.txt | while read -r line; do echo "::error title=Buildings::${line:0:300}"; done; exit 1; }
          cat check.txt

      # Starts a real dedicated server with the mod and fails unless it loads cleanly.
      - name: Server smoke test
        timeout-minutes: 15
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nspawn-protection=0\n' > run/server.properties
          touch server.log
          {
            for i in $(seq 1 300); do grep -q 'Done (' server.log && break; sleep 2; done
            echo "kingdomquest selftest"
            for i in $(seq 1 60); do grep -q 'Template self-test' server.log && break; sleep 2; done
            echo "stop"
          } | ./gradlew runServer --console=plain > server.log 2>&1 || true
          grep -E 'KingdomQuest|kingdomquest|ERROR|Exception' server.log | head -40
          if grep -iE "(couldn't|failed to|parsing error|error loading).*kingdomquest" server.log; then echo "::error title=Data::kingdomquest data failed to load"; exit 1; fi
          grep -q 'KingdomQuest loaded' server.log || { echo "::error title=Server smoke test::mod did not load"; exit 1; }
          grep -q 'Done (' server.log || { echo "::error title=Server smoke test::server did not start"; exit 1; }
          grep 'Template error' server.log | head -20 | while read -r line; do echo "::error title=Template::${line:0:500}"; done
          grep -q 'Template self-test passed' server.log || { echo "::error title=Template::self-test failed"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: kingdomquest
          path: build/libs/kingdomquest-*.jar
          if-no-files-found: error

      - name: Publish the jar to the ci-jar branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/jar
          cp $(ls build/libs/kingdomquest-*.jar | grep -v sources) /tmp/jar/
          cd /tmp/jar
          git init -q -b ci-jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '# KingdomQuest jar\n\nFrom commit %s.\n' "$GITHUB_SHA" > README.md
          git add -A
          git commit -qm "Jar for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-jar
