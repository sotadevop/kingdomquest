# Field test: founds settlements in real generated terrain (many biomes and heights), builds every track to its last
# level and measures the criteria of FieldTest (floating, buried, walkable, water, natural land, roads, walls).
# Runs on manual dispatch, or on a push whose commit message contains [fieldtest]. The report and the maps are
# published to the ci-fieldtest branch (fieldtest/report.md). Uses no secrets besides the workflow token.
name: Field test

on:
  push:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sites to run, separated by spaces (empty = all)'
        required: false
        default: ''

permissions:
  contents: write # only for the ci-fieldtest branch

jobs:
  fieldtest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fieldtest]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Run the field test
        timeout-minutes: 110
        env:
          SITES: ${{ github.event.inputs.sites }}
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'level-type=minecraft\\:normal\nlevel-seed=20261117\nonline-mode=false\nspawn-protection=0\nmax-tick-time=-1\nview-distance=4\nsimulation-distance=4\n' > run/server.properties
          touch server.log
          {
            for i in $(seq 1 600); do grep -q 'Done (' server.log && break; sleep 2; done
            echo "kingdomquest fieldtest ${SITES}"
            for i in $(seq 1 3000); do grep -q 'Field test finished' server.log && break; grep -q 'Stopping server\|Crash report' server.log && break; sleep 2; done
            echo "stop"
          } | ./gradlew runServer --console=plain > server.log 2>&1 || true
          grep -E 'Field test|KingdomQuest|ERROR|Exception' server.log | head -80

      - name: Publish the report to the ci-fieldtest branch
        if: always()
        run: |
          mkdir -p /tmp/out/fieldtest
          cp -r run/fieldtest/. /tmp/out/fieldtest/ 2>/dev/null || true
          grep -E 'Field test|KingdomQuest|kingdomquest|ERROR|Exception|at io\.github' server.log | head -400 > /tmp/out/fieldtest/log.txt || true
          cd /tmp/out
          git init -q -b ci-fieldtest
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '# KingdomQuest field test\n\nFrom commit %s (%s).\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.md
          git add -A
          git commit -qm "Field test for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-fieldtest
